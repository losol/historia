packages:
  - apphost
  - apps/**
  - packages/**
  - '!**/.next'
  - '!**/dist'
  - '!**/node_modules'

# Allow-list of packages whose install scripts may run (pnpm 11
# `strictDepBuilds` fails installs on any other dep with scripts).
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': false
  aws-crt: true
  esbuild: true
  libsql: true
  protobufjs: true
  sharp: true
  unrs-resolver: true

# Supply-chain protection: do not resolve packages published less than
# 10 days ago. Mirrors the eventuras monorepo posture.
minimumReleaseAge: 14400
minimumReleaseAgeStrict: false
minimumReleaseAgeExclude:
  # Our own first-party packages are trusted; skip the release-age gate.
  - '@eventuras/*'
  # Payload 3.90.1, forced in before it is 10 days old: every Payload package
  # must move in lockstep, and Dependabot could only reach 3.89.0 and then bumped
  # `payload` alone. Pinned to this exact version, so nothing newer slips
  # through. Safe to drop once 3.90.1 is past the gate (2026-09-28).
  - '@payloadcms/admin-bar@3.90.1'
  - '@payloadcms/db-postgres@3.90.1'
  - '@payloadcms/db-sqlite@3.90.1'
  - '@payloadcms/drizzle@3.90.1'
  - '@payloadcms/email-nodemailer@3.90.1'
  - '@payloadcms/graphql@3.90.1'
  - '@payloadcms/live-preview-react@3.90.1'
  - '@payloadcms/live-preview@3.90.1'
  - '@payloadcms/next@3.90.1'
  - '@payloadcms/plugin-cloud-storage@3.90.1'
  - '@payloadcms/plugin-form-builder@3.90.1'
  - '@payloadcms/plugin-import-export@3.90.1'
  - '@payloadcms/plugin-mcp@3.90.1'
  - '@payloadcms/plugin-multi-tenant@3.90.1'
  - '@payloadcms/plugin-nested-docs@3.90.1'
  - '@payloadcms/plugin-redirects@3.90.1'
  - '@payloadcms/plugin-search@3.90.1'
  - '@payloadcms/plugin-seo@3.90.1'
  - '@payloadcms/richtext-lexical@3.90.1'
  - '@payloadcms/storage-s3@3.90.1'
  - '@payloadcms/translations@3.90.1'
  - '@payloadcms/ui@3.90.1'
  - payload@3.90.1

peerDependencyRules:
  ignoreMissing:
    - '@types/react'
    - '@types/react-dom'
