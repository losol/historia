# 10-day cooldown mirrors `minimumReleaseAge` in pnpm-workspace.yaml.
# Do NOT add `allow: dependency-type: all` to npm — it walks every transitive
# package in the lockfile (~1400) and times out the job before any PR is opened.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    pull-request-branch-name:
      separator: "/"
    cooldown:
      default-days: 10
      exclude:
        - "@eventuras/*"
    ignore:
      # The Aspire AppHost's generated SDK imports `vscode-jsonrpc/node.js`, which
      # 9.x no longer exports, so a major bump breaks `aspire run`. The version is
      # Aspire's to move; take it from a fresh `aspire init` when upgrading Aspire.
      - dependency-name: "vscode-jsonrpc"
        update-types: ["version-update:semver-major"]
    groups:
      # First matching group wins — keep specific groups above the catch-alls.
      payload:
        patterns:
          - "payload"
          - "@payloadcms/*"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "next-sitemap"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
      # Everything else that is not a major, production and development alike, in
      # one PR. Majors outside the groups above still come one per package, as
      # each may need its own migration.
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 10
    groups:
      # All action bumps, majors included, in one PR. The PR runs CI and the Docker
      # build, so a breaking major there shows up before merge. The release job
      # (changesets/action) only runs on main: read its notes on a major bump.
      actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/apps/historia"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 10
    ignore:
      # Odd node majors are never LTS — bump to the next LTS manually.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
